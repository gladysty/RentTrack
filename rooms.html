<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentTrack | Rooms</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><span>R</span>RentTrack</div>
        <nav><a href="admin.html">Dashboard</a><a href="tenants.html">Tenants</a><a href="rooms.html" class="active">Rooms</a></nav>
        <div class="sidebar-bottom"><button type="button" class="sidebar-link logout-button">Log Out</button></div>
    </aside>

    <main class="main-content">
        <header class="dashboard-header">
            <div><h1>Rooms</h1><p>Manage rooms and their current occupants.</p></div>
            <div class="admin-profile"><div class="profile-circle">A</div><div><strong>Administrator</strong><small>Admin</small></div></div>
        </header>

        <section class="dashboard-section">
            <div class="section-heading">
                <div><h2>Room List</h2><p>Room status is based on the number of occupants.</p></div>
                <button type="button" class="primary-small-button" id="addRoomButton">+ Add Room</button>
            </div>

            <div class="search-row">
                <div class="search-box"><input type="search" id="roomSearch" placeholder="Search by room number..."></div>
                <span id="roomSearchCount" class="search-count"></span>
            </div>

            <div class="table-container">
                <table id="roomTable">
                    <thead><tr><th>Room Number</th><th>Occupants</th><th>Rent</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<!--ADD/EDIT ROOM MODAL-->

<div class="modal" id="roomModal">
    <div class="modal-content">
        <div class="modal-header"><h2>Add Room</h2><button type="button" class="close-button" id="closeRoomModal">×</button></div>
        <form id="roomForm" novalidate>
            <div class="form-group"><label for="roomNumber">Room Number</label><input type="text" id="roomNumber" placeholder="e.g. 105" required></div>
            <div class="form-group"><label for="roomRent">Rent Amount</label><input type="number" id="roomRent" min="0" placeholder="e.g. 250000" required></div>
            <p id="roomFormError" class="form-error"></p>
            <button type="submit" class="primary-button">Add Room</button>
        </form>
    </div>
</div>

<!--VIEW ROOM MODAL-->

<div class="modal" id="viewRoomModal">
    <div class="modal-content">
        <div class="modal-header"><h2>Room Details</h2><button type="button" class="close-button" id="closeViewRoomModal">×</button></div>
        <div class="details-list">
            <p><strong>Room Number</strong><span id="viewRoomNumber"></span></p>
            <p><strong>Number of Occupants</strong><span id="viewRoomOccupants"></span></p>
            <p><strong>Rent</strong><span id="viewRoomRent"></span></p>
            <p><strong>Status</strong><span id="viewRoomStatus"></span></p>
        </div>

<div class="occupants-section">

    <h3>Current Occupant(s)</h3>

    <div id="roomOccupantList" class="occupant-list"></div>

</div>

<div class="room-modal-actions">

    <button
        type="button"
        class="edit-room-modal-button"
        id="editRoomButton">
        Edit Room
    </button>

    <button
        type="button"
        class="delete-room-modal-button"
        id="deleteRoomButton">
        Delete Room
    </button>

</div>
</div>
</div>

<script src="js/script.js"></script>
</body>
</html>
