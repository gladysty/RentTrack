<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentTrack | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
    <section class="auth-info">
        <div class="logo"><span>R</span>RentTrack</div>
        <div class="welcome-text">
            <h1>Create your RentTrack account.</h1>
            <p>Create an account to access your own rental information.</p>
        </div>
        <p class="auth-footer">© 2026 RentTrack</p>
    </section>

    <section class="auth-form-section">
        <div class="auth-form-box">
            <div class="auth-header">
                <h2>Create account</h2>
                <p>Fill in your details to get started.</p>
            </div>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="Enter your 11-digit phone number" inputmode="numeric" maxlength="11" required>
                    <small id="phoneError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="password-box">
                        <input type="password" id="signupPassword" placeholder="Create a password" required>
                        <button type="button" id="toggleSignupPassword">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    <small id="passwordError" class="form-error"></small>
                </div>

                <button type="submit" class="primary-button">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
        </div>
    </section>
</div>
<script src="js/script.js"></script>
</body>
</html>
