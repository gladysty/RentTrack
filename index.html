<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentTrack | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
    <section class="auth-info">
        <div class="logo"><span>R</span>RentTrack</div>
        <div class="welcome-text">
            <h1>Simple rent tracking made easier.</h1>
            <p>Manage rooms, tenants and rent payments in one simple system.</p>
        </div>
        <p class="auth-footer">© 2026 RentTrack</p>
    </section>

    <section class="auth-form-section">
        <div class="auth-form-box">
            <div class="auth-header">
                <h2>Welcome back</h2>
                <p>Log in to your RentTrack account.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-box">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <button type="button" id="toggleLoginPassword">Show</button>
                    </div>
                </div>

                <p id="loginError" class="form-error"></p>
                <button type="submit" class="primary-button">Log In</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
        </div>
    </section>
</div>
<script src="js/script.js"></script>
</body>
</html>
